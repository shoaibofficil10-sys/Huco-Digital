<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>HUCO character artwork export</title><style>body{margin:0;background:#faf9f7;font:14px system-ui}#art{position:relative;width:600px;height:560px;margin:0 auto}canvas{width:100%;height:100%;display:block}button{display:block;margin:20px auto;padding:12px 24px;border:0;border-radius:8px;background:#cc1e2c;color:#fff}</style></head><body><div id="art"></div><button id="save" disabled>Download character poster</button><script type="module">import{mountCharacter}from'./assets/character-sculpture.mjs?v=poster';const host=document.getElementById('art');const model=await mountCharacter(host);const button=document.getElementById('save');button.disabled=false;button.onclick=()=>{model.pose(0,0);const a=document.createElement('a');a.download='huco-sculpture-poster.png';a.href=host.querySelector('canvas').toDataURL('image/png');a.click();};</script></body></html>
